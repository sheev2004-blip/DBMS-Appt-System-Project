<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(to bottom, #6a11cb, #2575fc);
            color: white;
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            margin: 15px 0;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .card {
            border-radius: 15px;
        }

        .topbar {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-book {
            background: #6a11cb;
            border: none;
        }

        .btn-book:hover {
            background: #2575fc;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4>SmartCare</h4>
            <a href="/patient">Dashboard</a>
            <a href="/patient">My Appointments</a>
            <a href="/medical_records">View Medical Records</a>
            <a href="/logout">Logout</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <div class="topbar">
                <h4>Book Appointment</h4>
            </div>

            <div class="container mt-4">

                <!-- Info Card -->
                <div class="card shadow p-4 text-center">
                    <h5>Schedule a Visit</h5>
                    <p class="text-muted mb-0">
                        Choose a doctor, date, and time to book your appointment.
                    </p>
                </div>

                <!-- Booking Form -->
                <div class="card shadow mt-4 p-4">
                    <h5>Appointment Details</h5>

                    <form method="POST" action="/book_appointment">

                        <div class="mb-3">
                            <label class="form-label">Select Doctor</label>
                            <select name="doctor_id" class="form-select" required>
                                {% for doctor in doctors %}
                                    <option value="{{ doctor.doctor_id }}">
                                        Dr. {{ doctor.first_name }} {{ doctor.last_name }} ({{ doctor.specialization }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Appointment Date</label>
                            <input type="date" name="appointment_date" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Appointment Time</label>
                            <input type="time" name="appointment_time" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-book text-white">
                            Book Appointment
                        </button>

                        <a href="/patient" class="btn btn-secondary ms-2">
                            Cancel
                        </a>

                    </form>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
