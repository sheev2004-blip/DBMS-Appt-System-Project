 <!DOCTYPE html>
<html>
<head>
    <title>Add Medical Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8f9fc);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
        }

        .form-label {
            font-weight: 500;
        }

        .header-title {
            font-weight: 600;
            color: #4e73df;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="col-md-6">
        <div class="card shadow-lg p-4">

            <!-- Title -->
            <div class="text-center mb-4">
                <h3 class="header-title">Add Medical Record</h3>
                <p class="text-muted">Enter patient health details and diagnosis</p>
            </div>

            <!-- Form -->
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Diagnosis</label>
                    <textarea name="diagnosis" class="form-control" rows="3" placeholder="Enter diagnosis..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Treatment Notes</label>
                    <textarea name="treatment" class="form-control" rows="3" placeholder="Enter treatment details..." required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Blood Pressure</label>
                        <input type="text" name="blood_pressure" class="form-control" placeholder="120/80">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Weight (kg)</label>
                        <input type="number" step="0.01" name="weight" class="form-control" placeholder="70">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Height (cm)</label>
                        <input type="number" step="0.01" name="height" class="form-control" placeholder="170">
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-3">
                    <a href="/doctor" class="btn btn-outline-secondary">← Back</a>
                    <button class="btn btn-primary px-4">Save Record</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
