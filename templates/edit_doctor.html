<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Doctor Availability</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(to bottom, #6a11cb, #2575fc);
            color: white;
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            margin: 15px 0;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .card {
            border-radius: 15px;
        }

        .topbar {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-save {
            background: #6a11cb;
            border: none;
            color: white;
        }

        .btn-save:hover {
            background: #2575fc;
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4>SmartCare</h4>
            <a href="/admin">Admin Dashboard</a>
            <a href="/logout">Logout</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <div class="topbar">
                <h4>Edit Doctor Availability</h4>
            </div>

            <div class="container mt-4">

                <div class="card shadow p-4">
                    <h5 class="mb-3">Doctor Information</h5>

                    <p class="mb-1"><strong>Name:</strong> Dr. {{ doctor.first_name }} {{ doctor.last_name }}</p>
                    <p class="mb-3"><strong>Specialization:</strong> {{ doctor.specialization }}</p>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label">Available From</label>
                            <input
                                type="time"
                                name="available_from"
                                class="form-control"
                                value="{{ doctor.available_from_str }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Available To</label>
                            <input
                                type="time"
                                name="available_to"
                                class="form-control"
                                value="{{ doctor.available_to_str }}"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-save">Save Changes</button>
                        <a href="/admin" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
